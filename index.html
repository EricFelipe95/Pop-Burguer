<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Pop Burger</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png">
</head>

<body>

        <div id="botoes-filtro">
            <button class="botoes" id="botao-lanches">Lanches</button>

    <div id="conteudo-cardapio">
        <ul>
        </ul>

    </div>
